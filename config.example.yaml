# Profiles are isolated: each has its own MySQL pool, SQL safety rules, and
# audit ring/log stream. There is no inherited or implicit default profile.
profiles:
  analytics:
    description: Read-only analytics replica
    mysql:
      host: 127.0.0.1          # Docker: use host.docker.internal for the host
      port: 3306
      user: mcp_analytics      # Use a dedicated least-privilege account
      password: ${ANALYTICS_MYSQL_PASSWORD}
      database: analytics
      pool:
        max_open: 5
        max_idle: 2
    security:
      allowed_statements: [select]
      table_whitelist:
        - "analytics.*"
      max_rows: 1000
      query_timeout: 30s
      block_unfiltered_writes: true
      max_script_statements: 50
    audit:
      enabled: false           # mysql_stats still works while JSONL is disabled
      log_dir: ~/.mcp-server-mysql/logs
      slow_query_threshold: 1s
      ring_buffer_size: 1000

  app_writer:
    description: Application database for reviewed maintenance writes
    mysql:
      host: 127.0.0.1
      port: 3306
      user: mcp_writer
      password: ${APP_WRITER_MYSQL_PASSWORD}
      database: myapp
      pool:
        max_open: 3
        max_idle: 1
    security:
      allowed_statements: [select, insert, update]
      table_whitelist:
        - "myapp.orders"
        - "myapp.order_notes"
      max_rows: 500
      query_timeout: 15s
      block_unfiltered_writes: true
      max_script_statements: 10
    audit:
      enabled: true
      # Shared directories are safe: files are audit-<profile>-<date>.jsonl.
      log_dir: ~/.mcp-server-mysql/logs
      slow_query_threshold: 500ms
      ring_buffer_size: 500

# Resources are global. Set false to skip table discovery and the MCP App.
resources:
  enabled: true
